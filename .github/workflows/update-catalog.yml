name: Update template catalogue
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.widget.json'
      - '**/*.png'
      - '**/category.json'
      - '.github/scripts/build_catalog.py'
      - '.github/workflows/update-catalog.yml'
permissions:
  contents: write
concurrency:
  group: template-catalog
  cancel-in-progress: true
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified upstream tag
      - name: Rebuild catalogue
        run: python3 .github/scripts/build_catalog.py
      - name: Commit catalogue changes
        run: |
          if ! git diff --quiet -- catalog.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- catalog.json
            git commit -m 'Update template catalogue'
            git push
          fi
